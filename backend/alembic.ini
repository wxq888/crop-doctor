# ============================================
# CropDoctor backend - Alembic config
# Usage: cd backend && ../.venv/Scripts/python.exe -m alembic upgrade head
# Note: sqlalchemy.url is intentionally blank; migrations/env.py injects it
#       from the repository-root .env file (app.core.config.settings).
#       Keep this file ASCII-only (Windows locale codec used by configparser).
# ============================================

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
