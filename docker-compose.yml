# 作物医生 CropDoctor · 本地开发/演示编排
# 目前仅提供基础设施，backend / 前端服务随开发进度逐步加入
# 使用：docker compose up -d

services:
  mysql:
    image: mysql:8.4
    container_name: cropdoctor-mysql
    environment:
      MYSQL_DATABASE: crop_doctor
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: cropdoctor-redis
    ports:
      - "6379:6379"

  # backend:        # FastAPI 后端（Dockerfile 就绪后启用）
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   depends_on: [mysql, redis]
  #   volumes:
  #     - ./ml/exports:/app/ml/exports

volumes:
  mysql_data:
